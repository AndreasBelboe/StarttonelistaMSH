<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knauskorets Starttoneliste</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: repeating-linear-gradient(
        180deg,
        #f0f0f0 0px,
        #f0f0f0 50px,
        #bbbbbb 50px,
        #bbbbbb 100px
      );
      color: #111;
      font-size: 2em;
      margin: 0;
      padding: 2em;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1.5em;
      color: #111;
      font-size: 0.6em;
      text-decoration: none;
      background-color: #ffffffee;
      padding: 0.2em 0.6em;
      border-radius: 4px;
    }
    .back-link:hover { background-color: #fff; }
    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
      line-height: 1.2;
      border-left: 10px solid #111;
      color: #111;
      background-color: #ffffffee;
      padding: 0.3em 0.5em;
      border-radius: 4px;
    }
    .logo {
      display: block;
      max-height: 150px;
      margin: 1em 0;
    }
    .bokstav-nav {
      background-color: #ffffffdd;
      border-radius: 8px;
      padding: 0.5em 0.8em;
      margin: 1.5em 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.3em;
    }
    .bokstav-nav a {
      color: #111;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.7em;
      padding: 0.2em 0.4em;
      border-radius: 4px;
      background-color: #ffffffcc;
      border: 2px solid #111;
    }
    .bokstav-nav a:hover { background-color: #fff; }
    hr {
      border: none;
      border-top: 3px solid #111;
      margin: 1.5em 0;
      opacity: 0.3;
    }
    h2 {
      font-size: 1.8em;
      background-color: #ffffffee;
      display: inline-block;
      padding: 0.1em 0.4em;
      border-radius: 4px;
      margin-bottom: 0.5em;
    }
    .sang-kort {
      background-color: #ffffffcc;
      border: 3px solid #111;
      border-radius: 8px;
      padding: 0.6em 1em;
      margin-bottom: 0.7em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
    }
    .sang-tittel {
      font-weight: 600;
      font-size: 0.85em;
    }
    .starttoner {
      font-size: 0.75em;
      color: #444;
      text-align: right;
      white-space: nowrap;
      margin-left: 1em;
    }
    .tone-boble {
      display: inline-block;
      background-color: #222;
      color: #fff;
      border-radius: 50%;
      width: 1.6em;
      height: 1.6em;
      line-height: 1.6em;
      text-align: center;
      font-weight: 600;
      margin-left: 0.3em;
      font-size: 0.9em;
    }
    footer {
      margin-top: 4em;
      font-size: 0.6em;
      color: #111;
      background-color: #ffffffcc;
      display: inline-block;
      padding: 0.4em 0.8em;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <a class="back-link" href="andre_kor.html">← Tilbake</a>

  <h1>Knauskorets<br>Starttoneliste!</h1>

  <img class="logo" src="knauskoret_logo.png" alt="Knauskoret-logo">

  <nav class="bokstav-nav">
    <a href="#A">A</a>
    <a href="#C">C</a>
    <a href="#H">H</a>
    <a href="#L">L</a>
    <a href="#P">P</a>
    <a href="#T">T</a>
    <a href="#U">U</a>
    <a href="#V">V</a>
  </nav>

  <hr>

  <h2 id="A">A</h2>

  <div class="sang-kort">
    <span class="sang-tittel">Ambassanova</span>
    <span class="starttoner"><span class="tone-boble">E</span></span>
  </div>

  <h2 id="C">C</h2>

  <div class="sang-kort">
    <span class="sang-tittel">Choices</span>
    <span class="starttoner"><span class="tone-boble">E</span><span class="tone-boble">G</span></span>
  </div>

  <h2 id="H">H</h2>

  <div class="sang-kort">
    <span class="sang-tittel">Hysteria</span>
    <span class="starttoner"><span class="tone-boble">A</span></span>
  </div>

  <h2 id="L">L</h2>

  <div class="sang-kort">
    <span class="sang-tittel">Lite og stort</span>
    <span class="starttoner"><span class="tone-boble">C</span><span class="tone-boble">G</span><span class="tone-boble">E</span></span>
  </div>

  <h2 id="P">P</h2>

  <div class="sang-kort">
    <span class="sang-tittel">Pulemedley</span>
    <span class="starttoner"><span class="tone-boble">D#</span><span class="tone-boble">G</span><span class="tone-boble">A#</span></span>
  </div>

  <h2 id="T">T</h2>

  <div class="sang-kort">
    <span class="sang-tittel">The Seed</span>
    <span class="starttoner"><span class="tone-boble">A</span><span class="tone-boble">D</span></span>
  </div>

  <div class="sang-kort">
    <span class="sang-tittel">The Way I Are</span>
    <span class="starttoner"><span class="tone-boble">G#</span></span>
  </div>

  <div class="sang-kort">
    <span class="sang-tittel">Thomas-toget</span>
    <span class="starttoner"><span class="tone-boble">D#</span><span class="tone-boble">A#</span><span class="tone-boble">G</span><span class="tone-boble">D#</span></span>
  </div>

  <h2 id="U">U</h2>

  <div class="sang-kort">
    <span class="sang-tittel">Ulveham</span>
    <span class="starttoner"><span class="tone-boble">H</span></span>
  </div>

  <h2 id="V">V</h2>

  <div class="sang-kort">
    <span class="sang-tittel">Venus</span>
    <span class="starttoner"><span class="tone-boble">C</span></span>
  </div>

  <footer>Laget med kjærlighet av Andreas Belboe. Fordi det synges for lite!</footer>

</body>
</html>
