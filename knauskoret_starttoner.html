<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knauskorets Starttoneliste</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: repeating-linear-gradient(
        180deg,
        #f0f0f0 0px,
        #f0f0f0 50px,
        #bbbbbb 50px,
        #bbbbbb 100px
      );
      margin: 0;
      padding: 1em;
      color: #111;
    }
    a.back-link {
      display: inline-block;
      margin-bottom: 1em;
      font-size: 1em;
      color: #111;
      text-decoration: none;
      background-color: #ffffffee;
      padding: 0.4em 1em;
      border-radius: 6px;
      font-weight: bold;
    }
    h1 {
      margin-bottom: 1em;
      font-size: 1.6em;
      color: #111;
      border-left: 6px solid #111;
      padding-left: 0.5em;
      background-color: #ffffffcc;
      padding: 0.3em 0.5em;
      border-radius: 4px;
    }
    img.logo {
      display: block;
      margin-bottom: 0.5em;
      max-width: 180px;
    }
    .letter-nav {
      margin-bottom: 1em;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4em;
    }
    .letter-nav a {
      font-size: 1em;
      text-decoration: none;
      background-color: #111;
      color: #fff;
      padding: 0.2em 0.6em;
      border-radius: 4px;
      font-weight: 600;
    }
    .letter-nav a:hover {
      background-color: #333;
    }
    button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6em 1em;
      margin: 0.3em 0;
      font-size: 1em;
      width: 100%;
      max-width: 400px;
      background-color: #ffffffcc;
      border: none;
      border-left: 4px solid #111;
      border-radius: 4px;
      text-align: left;
      color: #111;
      cursor: pointer;
    }
    button.playing {
      background-color: #cccccc !important;
      transition: background-color 0.3s ease;
    }
    .tone-boble {
      display: inline-block;
      background-color: #111;
      color: #fff;
      border-radius: 50%;
      width: 1.8em;
      height: 1.8em;
      line-height: 1.8em;
      text-align: center;
      font-weight: 600;
      margin-left: 0.3em;
      font-size: 0.85em;
      flex-shrink: 0;
    }
    .starttoner {
      display: flex;
      align-items: center;
      margin-left: auto;
      padding-left: 0.5em;
    }
    hr {
      border: none;
      height: 4px;
      background-color: #111;
      width: 400px;
      max-width: 100%;
      margin: 1em 0;
      opacity: 0.4;
    }
    footer {
      margin-top: 3em;
      text-align: left;
      font-size: 0.9em;
      color: #111;
      background-color: #ffffffcc;
      display: inline-block;
      padding: 0.3em 0.6em;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <a class="back-link" href="andre_kor.html">← Tilbake</a>

  <h1>Knauskorets<br/>Starttoneliste!</h1>

  <img class="logo" src="knauskoret_logo.png" alt="Knauskoret-logo">

  <div class="letter-nav">
    <a href="#A">A</a>
    <a href="#C">C</a>
    <a href="#H">H</a>
    <a href="#L">L</a>
    <a href="#P">P</a>
    <a href="#T">T</a>
    <a href="#U">U</a>
    <a href="#V">V</a>
  </div>

  <hr />

  <h2 id="A">A</h2>
  <button onclick='playNotes(["E3"], this)'><strong>Ambassanova</strong><span class="starttoner"><span class="tone-boble">E</span></span></button>

  <h2 id="C">C</h2>
  <button onclick='playNotes(["E3", "G3"], this)'><strong>Choices</strong><span class="starttoner"><span class="tone-boble">E</span><span class="tone-boble">G</span></span></button>

  <h2 id="H">H</h2>
  <button onclick='playNotes(["A3"], this)'><strong>Hysteria</strong><span class="starttoner"><span class="tone-boble">A</span></span></button>

  <h2 id="L">L</h2>
  <button onclick='playNotes(["C3", "G3", "E3"], this)'><strong>Lite og stort</strong><span class="starttoner"><span class="tone-boble">C</span><span class="tone-boble">G</span><span class="tone-boble">E</span></span></button>

  <h2 id="P">P</h2>
  <button onclick='playNotes(["Eb3", "G3", "Bb3"], this)'><strong>Pulemedley</strong><span class="starttoner"><span class="tone-boble">D#</span><span class="tone-boble">G</span><span class="tone-boble">A#</span></span></button>

  <h2 id="T">T</h2>
  <button onclick='playNotes(["A3", "D3"], this)'><strong>The Seed</strong><span class="starttoner"><span class="tone-boble">A</span><span class="tone-boble">D</span></span></button>
  <button onclick='playNotes(["Ab3"], this)'><strong>The Way I Are</strong><span class="starttoner"><span class="tone-boble">G#</span></span></button>
  <button onclick='playNotes(["Eb3", "Bb3", "G3"], this)'><strong>Thomas-toget</strong><span class="starttoner"><span class="tone-boble">D#</span><span class="tone-boble">A#</span><span class="tone-boble">G</span></span></button>

  <h2 id="U">U</h2>
  <button onclick='playNotes(["B3"], this)'><strong>Ulveham</strong><span class="starttoner"><span class="tone-boble">H</span></span></button>

  <h2 id="V">V</h2>
  <button onclick='playNotes(["C3"], this)'><strong>Venus</strong><span class="starttoner"><span class="tone-boble">C</span></span></button>

  <footer>Laget med kjærlighet av Andreas Belboe. Fordi det synges for lite!</footer>

  <script>
    function playNotes(notes, btn) {
      if (btn) {
        btn.classList.add('playing');
        setTimeout(() => btn.classList.remove('playing'), notes.length * 400 + 200);
      }
      let delay = 0;
      for (const note of notes) {
        setTimeout(() => {
          const audio = new Audio(`notes/${note}.mp3`);
          audio.play().catch(error => {
            console.error("Lydfeil:", error);
          });
        }, delay);
        delay += 400;
      }
    }
  </script>

</body>
</html>
